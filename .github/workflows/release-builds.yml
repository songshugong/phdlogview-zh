name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MSYS2 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gsl
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-wxwidgets3.2-msw

      - name: Configure
        run: cmake -S . -B build-windows -G Ninja -DHAVE_WXFB=0 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-windows --config Release

      - name: Package
        run: |
          mkdir -p dist/package
          cp build-windows/phdlogview.exe dist/package/
          cp build-windows/README.txt build-windows/LICENSE.txt dist/package/
          cp -R build-windows/languages dist/package/
          ldd build-windows/phdlogview.exe | awk '/mingw64/ {print $3}' | sort -u | while read -r dll; do
            cp "$dll" dist/package/
          done
          (cd dist/package && zip -r ../phdlogview-windows-x86_64.zip .)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phdlogview-windows-x86_64
          path: dist/phdlogview-windows-x86_64.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/phdlogview-windows-x86_64.zip

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgsl-dev libwxgtk3.2-dev ninja-build

      - name: Configure
        run: cmake -S . -B build-linux -G Ninja -DHAVE_WXFB=0 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-linux --config Release

      - name: Package
        run: |
          mkdir -p dist/package
          cp build-linux/phdlogview dist/package/
          cp build-linux/README.txt build-linux/LICENSE.txt dist/package/
          cp -R build-linux/languages dist/package/
          tar -czf dist/phdlogview-linux-x86_64.tar.gz -C dist/package .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phdlogview-linux-x86_64
          path: dist/phdlogview-linux-x86_64.tar.gz

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/phdlogview-linux-x86_64.tar.gz
