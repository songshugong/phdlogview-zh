name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MSYS2 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gsl
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-wxwidgets3.2-msw

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Configure
        run: cmake -S . -B build-windows -G Ninja -DHAVE_WXFB=0 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-windows --config Release

      - name: Package
        run: |
          mkdir -p dist/installer-work/Release
          cp build-windows/phdlogview.exe dist/installer-work/Release/
          cp build-windows/README.txt build-windows/LICENSE.txt dist/installer-work/Release/
          cp -R build-windows/languages dist/installer-work/Release/
          ldd build-windows/phdlogview.exe | awk '/mingw64/ {print $3}' | sort -u | while read -r dll; do
            cp "$dll" dist/installer-work/Release/
          done
          sed 's/@VERSION@/0.6.5-zh1/g' phdlogview-x64.iss.in > dist/installer-work/phdlogview-x64.iss

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "dist\installer-work\phdlogview-x64.iss"
          Copy-Item "dist\installer-work\Output\phdlogview-windows-x86_64-setup.exe" "dist\phdlogview-windows-x86_64-setup.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phdlogview-windows-x86_64
          path: dist/phdlogview-windows-x86_64-setup.exe

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/phdlogview-windows-x86_64-setup.exe

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake dpkg-dev g++ libgsl-dev libwxgtk3.2-dev ninja-build

      - name: Configure
        run: cmake -S . -B build-linux -G Ninja -DHAVE_WXFB=0 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-linux --config Release

      - name: Package
        run: |
          mkdir -p dist/debroot/DEBIAN
          DESTDIR="$PWD/dist/debroot" cmake --install build-linux --prefix /usr --strip
          depends="$(dpkg-shlibdeps -O dist/debroot/usr/bin/phdlogview | sed 's/^shlibs:Depends=//')"
          cat > dist/debroot/DEBIAN/control <<EOF
          Package: phdlogview
          Version: 0.6.5-1zh
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: songshugong <songshugong@users.noreply.github.com>
          Depends: ${depends}
          Suggests: phd2
          Description: PHD2 Log Viewer with Simplified Chinese localization
           PHD2 Log Viewer is a tool for quickly visualizing guiding
           performance and spotting problems in PHD2 Guide Log files.
          EOF
          dpkg-deb --build dist/debroot dist/phdlogview-linux-amd64.deb

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phdlogview-linux-x86_64
          path: dist/phdlogview-linux-amd64.deb

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/phdlogview-linux-amd64.deb
